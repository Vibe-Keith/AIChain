<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aichain web miner</title>
<style>
  :root {
    --bg: #eef1f4; --panel: #ffffff; --ink: #1a2230; --muted: #5b6577; --line: #d5dbe3;
    --accent: #2f5bea; --bar: #9fb3d9; --hit: #c98a12;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12161d; --panel: #1a2029; --ink: #e6eaf0; --muted: #96a0b0; --line: #2b3340;
      --accent: #7ea0ff; --bar: #3d5288; --hit: #e2a93b; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 "Avenir Next", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 20px 48px; display: grid; gap: 28px;
    grid-template-columns: minmax(260px, 320px) 1fr; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .lede { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
  label { display: block; font-size: .875rem; color: var(--muted); margin: 14px 0 4px; }
  input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: var(--ink); font: inherit; }
  input:disabled { opacity: .6; }
  button { margin-top: 22px; width: 100%; padding: 11px; border: 0; border-radius: 6px; font: inherit; font-weight: 600;
    background: var(--accent); color: #fff; cursor: pointer; }
  button[data-on] { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .rate { font-size: clamp(2.6rem, 7vw, 4.2rem); font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .unit { color: var(--muted); margin: 6px 0 18px; }
  #status { color: var(--accent); }
  canvas { width: 100%; height: 120px; display: block; border-bottom: 1px solid var(--line); }
  .legend { font-size: .8rem; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--hit); margin-right: 5px; }
  dl { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 22px 0; }
  @media (max-width: 480px) { dl { grid-template-columns: repeat(2, 1fr); } }
  dt { font-size: .8rem; color: var(--muted); } dd { margin: 0; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
  .ids { font-size: .82rem; color: var(--muted); overflow-wrap: anywhere; }
  .ids code { color: var(--ink); }
  ul { list-style: none; padding: 0; margin: 16px 0 0; font-size: .85rem; color: var(--muted); max-height: 220px; overflow: auto; }
  li { padding: 3px 0; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<main>
  <section>
    <h1>aichain web miner</h1>
    <p class="lede">Your browser answers user queries for the pool. You earn coin for every share it finds.</p>
    <label for="pool">Pool address</label>
    <input id="pool" autocomplete="off">
    <label for="seed">Wallet name (your payout key comes from this)</label>
    <input id="seed" autocomplete="off">
    <label for="threads">Threads</label>
    <input id="threads" type="number" min="1" max="32">
    <button id="toggle">Start mining</button>
  </section>
  <section aria-live="polite">
    <div class="rate" id="rate">0</div>
    <div class="unit">inference steps per second, <span id="status">idle</span></div>
    <canvas id="chart" aria-label="Inference rate over the last 90 seconds"></canvas>
    <div class="legend"><i></i>share found that second</div>
    <dl>
      <div><dt>Shares accepted</dt><dd id="shares">0</dd></div>
      <div><dt>Blocks found</dt><dd id="blocks">0</dd></div>
      <div><dt>Owed</dt><dd id="owed">0</dd></div>
      <div><dt>Paid</dt><dd id="paid">0</dd></div>
    </dl>
    <p class="ids">Payout address <code id="address">appears when mining starts</code><br>Model <code id="model">not loaded</code></p>
    <ul id="log"></ul>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
